global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "systemvibe-monitor"

# Alertmanager configuration (optional - for future alerting)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files: []

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # SystemVibe API metrics
  - job_name: "systemvibe-api"
    static_configs:
      - targets: ["api:3000"]
    metrics_path: "/api/metrics"
    scrape_interval: 5s
    scrape_timeout: 3s

  # Redis metrics (if using redis_exporter - optional)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis:6379']

  # PostgreSQL metrics (if using postgres_exporter - optional)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres:5432']
