services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: systemvibe-postgres
    env_file:
      - ../../.env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U systemvibe"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - systemvibe

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: systemvibe-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - systemvibe

  # Redis Commander Dashboard
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: systemvibe-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8001:8081"
    depends_on:
      - redis
    networks:
      - systemvibe

  # Nginx Reverse Proxy (optional, for learning)
  nginx:
    image: nginx:alpine
    container_name: systemvibe-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - systemvibe

  # API Server
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: systemvibe-api
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - ../../apps/api/src:/app/src:ro
      - ../../apps/api/package.json:/app/package.json:ro
      - ../../apps/api/tsconfig.json:/app/tsconfig.json:ro
    command: npm run dev
    networks:
      - systemvibe

  # Image Worker
  worker-image:
    build:
      context: ../../
      dockerfile: apps/worker-image/Dockerfile
    environment:
      DATABASE_URL: postgresql://systemvibe:devpassword@postgres:5432/systemvibe
      DB_USER: systemvibe
      DB_PASSWORD: devpassword
      DB_NAME: systemvibe
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: info
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f node || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - systemvibe

volumes:
  postgres_data:
  redis_data:

networks:
  systemvibe:
    driver: bridge
