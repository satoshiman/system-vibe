apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: system-vibe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: default
      containers:
        - name: api
          image: asia-southeast1-docker.pkg.dev/system-vibe/system-vibe/api:v4
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: system-vibe-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 15

        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - "--structured-logs"
            - "--port=5432"
            - "system-vibe:asia-southeast1:system-vibe-db"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
      terminationGracePeriodSeconds: 30
